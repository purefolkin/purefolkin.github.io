name: Purefolk web checks

on:
  push:
    branches:
      - feat/purefolk-platform-foundation
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/migrations/**"
      - ".github/workflows/purefolk-web.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://purefolk.in
